<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikShop - Viral Products</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav class="navbar">
                <a href="#" class="logo">
                    <i class="fas fa-bolt"></i>
                    TikShop
                </a>
                <div class="nav-links">
                    <a href="#" class="active">Home</a>
                    <a href="#products">Products</a>
                    <a href="admin.html">Admin</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Discover Viral TikTok Products</h1>
            <p>Shop the hottest products trending on TikTok and social media</p>
            <div class="hero-buttons">
                <button class="btn btn-primary" onclick="scrollToProducts()">Shop Now</button>
                <button class="btn btn-secondary" onclick="scrollToTrending()">Trending Now</button>
            </div>
        </div>
    </section>

    <!-- Banner Ad Space - Top -->
    <div class="ad-container">
        <div class="container">
            <div id="awn-z10616050"></div>
        </div>
    </div>

    <!-- Products Section -->
    <section id="products" class="products-section">
        <div class="container">
            <h2 class="section-title">Featured Products</h2>
            
            <div class="filters">
                <button class="filter-btn active" onclick="filterProducts('all')">All Products</button>
                <button class="filter-btn" onclick="filterProducts('tiktok')">TikTok</button>
                <button class="filter-btn" onclick="filterProducts('amazon')">Amazon</button>
            </div>

            <div class="products-grid" id="products-grid">
                <!-- Products loaded by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Banner Ad Space - Middle -->
    <div class="ad-container">
        <div class="container">
            <div id="awn-z10616050"></div>
        </div>
    </div>

    <!-- Trending Section -->
    <section id="trending" class="trending-section">
        <div class="container">
            <h2 class="section-title">🔥 Trending Now</h2>
            <div class="products-grid" id="trending-grid">
                <!-- Trending products loaded by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Banner Ad Space - Bottom -->
    <div class="ad-container">
        <div class="container">
            <div id="awn-z10616050"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2023 TikShop. All rights reserved.</p>
        </div>
    </footer>

    <!-- Hidden Ad Links -->
    <a href="https://onclickalgo.com/al/visit.php?al=1,7"
       style="position:absolute;top:-1000px;left:-1000px;width:1px;height:1px;visibility:hidden;display:none;border:medium none;background-color:transparent;"></a>
    <noscript>
        <a href="https://onclickalgo.com/al/visit.php?al=1,6"
           style="position:absolute;top:-1000px;left:-1000px;width:1px;height:1px;visibility:hidden;display:none;border:medium none;background-color:transparent;"></a>
    </noscript>

    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
